<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Disable browser scroll restoration before it can restore an old position. -->
    <script>
      (() => {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('is-intro-active')
        }
        const scrollToTop = () => {
          try {
            window.scrollTo({ top: 0, left: 0, behavior: 'instant' })
          } catch {
            window.scrollTo(0, 0)
          }
        }
        const reset = () => {
          if (location.hash) {
            try {
              history.replaceState(history.state, '', location.href.split('#')[0])
            } catch {
              /* Ignore history restrictions in constrained contexts. */
            }
          }
          scrollToTop()
        }
        let interacted = false
        for (const event of ['pointerdown', 'wheel', 'touchstart', 'keydown']) {
          addEventListener(
            event,
            () => {
              interacted = true
            },
            { once: true, passive: true },
          )
        }
        reset()
        document.addEventListener('DOMContentLoaded', reset, { once: true })
        addEventListener('pageshow', (event) => {
          if (event.persisted || !interacted) reset()
        })
      })()
    </script>
    <meta name="theme-color" content="#F6F1E7" />
    <meta
      name="description"
      content="A quieter space to read, reflect, and remember. Quran Bytes is a free, open-source, ad-free Islamic learning platform in development."
    />
    <title>Quran Bytes — Read. Reflect. Remember.</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html.is-intro-active {
        background: #0f3d2e;
        overflow: hidden;
      }
      html.is-intro-active:not(.is-intro-leaving) body {
        background: #0f3d2e;
      }
      html.is-intro-active .intro {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 999;
        background: #0f3d2e;
        color: #f6f1e7;
        align-items: center;
        justify-content: center;
      }
      html.is-intro-active .intro:not(.is-leaving) {
        opacity: 1;
      }
      html.is-intro-active:not(.is-intro-leaving) #main,
      html.is-intro-active:not(.is-intro-leaving) .site-header,
      html.is-intro-active:not(.is-intro-leaving) .visual-stage,
      html.is-intro-active:not(.is-intro-leaving) .site-help {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <style>
        .intro,
        .word-mask,
        .concept-footnote {
          display: none !important;
        }
      </style>
    </noscript>
  </body>
</html>
